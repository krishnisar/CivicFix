<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>CivicFix | Community Help</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<header>

    <nav class="navbar">

        <div class="logo">
            🏙️ CivicFix
        </div>

        <ul class="nav-links">

            <li>
                <a href="index.html">
                    Home
                </a>
            </li>

            <li>
                <a href="report.html">
                    Report Issue
                </a>
            </li>

            <li>
                <a href="issues.html">
                    Track Issues
                </a>
            </li>

            <li>
                <a href="help.html"
                   class="active">
                    Community Help
                </a>
            </li>

            <li>
                <a href="dashboard.html">
                    Dashboard
                </a>
            </li>

        </ul>

    </nav>

</header>


<main>

<section class="page-section">

    <div class="page-heading">

        <p class="small-title">
            COMMUNITY SUPPORT
        </p>

        <h1>
            Community Help Board
        </h1>

        <p>
            Request assistance or offer your support to people
            in the community.
        </p>

    </div>


    <!-- HELP FORM -->

    <div class="form-container">

        <form id="helpForm">


            <div class="form-row">

                <div class="form-group">

                    <label for="helpName">
                        Name
                    </label>

                    <input
                        type="text"
                        id="helpName"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="helpContact">
                        Contact
                    </label>

                    <input
                        type="tel"
                        id="helpContact"
                        required
                    >

                </div>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label for="helpType">
                        Type
                    </label>

                    <select id="helpType" required>

                        <option value="">
                            Select type
                        </option>

                        <option value="Request Help">
                            Request Help
                        </option>

                        <option value="Offer Help">
                            Offer Help
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="helpCategory">
                        Category
                    </label>

                    <select id="helpCategory" required>

                        <option value="">
                            Select category
                        </option>

                        <option value="Books">
                            Books / Stationery
                        </option>

                        <option value="Food">
                            Food Donation
                        </option>

                        <option value="Clothing">
                            Clothing
                        </option>

                        <option value="Volunteering">
                            Volunteer Assistance
                        </option>

                        <option value="Elderly">
                            Elderly Assistance
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>

            </div>


            <div class="form-group">

                <label for="helpArea">
                    Area
                </label>

                <input
                    type="text"
                    id="helpArea"
                    placeholder="Enter your area"
                    required
                >

            </div>


            <div class="form-group">

                <label for="helpDescription">
                    Description
                </label>

                <textarea
                    id="helpDescription"
                    rows="4"
                    placeholder="Describe the help required or offered..."
                    required
                ></textarea>

            </div>


            <div class="form-group">

                <label for="helpDate">
                    Date
                </label>

                <input
                    type="date"
                    id="helpDate"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn primary-btn full-btn">

                Post on Help Board

            </button>


            <div
                id="helpMessage"
                class="message">
            </div>


        </form>

    </div>


    <!-- POSTS -->

    <div class="page-heading board-heading">

        <h2>
            Latest Community Posts
        </h2>

    </div>


    <div
        id="helpContainer"
        class="help-grid">

    </div>


</section>

</main>


<footer>

    <p>
        © 2026 CivicFix
    </p>

</footer>


<script src="script.js"></script>

</body>
</html>
