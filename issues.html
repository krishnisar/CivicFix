<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>CivicFix | Track Issues</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<header>

    <nav class="navbar">

        <div class="logo">
            🏙️ CivicFix
        </div>

        <ul class="nav-links">

            <li>
                <a href="index.html">
                    Home
                </a>
            </li>

            <li>
                <a href="report.html">
                    Report Issue
                </a>
            </li>

            <li>
                <a href="issues.html"
                   class="active">
                    Track Issues
                </a>
            </li>

            <li>
                <a href="help.html">
                    Community Help
                </a>
            </li>

            <li>
                <a href="dashboard.html">
                    Dashboard
                </a>
            </li>

        </ul>

    </nav>

</header>


<main>

<section class="page-section">

    <div class="page-heading">

        <p class="small-title">
            ISSUE MANAGEMENT
        </p>

        <h1>
            Reported Civic Issues
        </h1>

        <p>
            Search complaints, filter them and update their status.
        </p>

    </div>


    <!-- FILTERS -->

    <div class="filter-container">

        <input
            type="text"
            id="issueSearch"
            placeholder="🔎 Search by location, category or name..."
        >


        <select id="statusFilter">

            <option value="All">
                All Statuses
            </option>

            <option value="Pending">
                Pending
            </option>

            <option value="In Progress">
                In Progress
            </option>

            <option value="Resolved">
                Resolved
            </option>

        </select>


        <select id="urgencyFilter">

            <option value="All">
                All Priorities
            </option>

            <option value="High">
                High
            </option>

            <option value="Medium">
                Medium
            </option>

            <option value="Low">
                Low
            </option>

        </select>

    </div>


    <!-- ISSUES -->

    <div
        id="issuesContainer"
        class="issues-container">

    </div>


</section>

</main>


<footer>

    <p>
        © 2026 CivicFix
    </p>

</footer>


<script src="script.js"></script>

</body>
</html>
