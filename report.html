<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CivicFix | Report Issue</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<header>

    <nav class="navbar">

        <div class="logo">
            🏙️ CivicFix
        </div>

        <ul class="nav-links">

            <li>
                <a href="index.html">
                    Home
                </a>
            </li>

            <li>
                <a href="report.html"
                   class="active">
                    Report Issue
                </a>
            </li>

            <li>
                <a href="issues.html">
                    Track Issues
                </a>
            </li>

            <li>
                <a href="help.html">
                    Community Help
                </a>
            </li>

            <li>
                <a href="dashboard.html">
                    Dashboard
                </a>
            </li>

        </ul>

    </nav>

</header>


<main>

<section class="form-section">

    <div class="page-heading">

        <p class="small-title">
            CIVIC ISSUE REPORTING
        </p>

        <h1>
            Report a Community Issue
        </h1>

        <p>
            Provide accurate details so the issue can be
            recorded and tracked.
        </p>

    </div>


    <div class="form-container">

        <form id="issueForm">

            <div class="form-row">

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="contact">
                        Contact Number
                    </label>

                    <input
                        type="tel"
                        id="contact"
                        placeholder="Enter contact number"
                        required
                    >

                </div>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label for="area">
                        Area / Location
                    </label>

                    <input
                        type="text"
                        id="area"
                        placeholder="e.g. Marine Drive"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="category">
                        Issue Category
                    </label>

                    <select id="category" required>

                        <option value="">
                            Select category
                        </option>

                        <option value="Garbage">
                            Garbage / Waste
                        </option>

                        <option value="Pothole">
                            Pothole / Road
                        </option>

                        <option value="Water Leakage">
                            Water Leakage
                        </option>

                        <option value="Street Light">
                            Broken Street Light
                        </option>

                        <option value="Sanitation">
                            Sanitation
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>

            </div>


            <div class="form-group">

                <label for="description">
                    Issue Description
                </label>

                <textarea
                    id="description"
                    rows="5"
                    placeholder="Describe the problem..."
                    required
                ></textarea>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label for="urgency">
                        Urgency
                    </label>

                    <select id="urgency" required>

                        <option value="">
                            Select urgency
                        </option>

                        <option value="Low">
                            Low
                        </option>

                        <option value="Medium">
                            Medium
                        </option>

                        <option value="High">
                            High
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="date">
                        Date
                    </label>

                    <input
                        type="date"
                        id="date"
                        required
                    >

                </div>

            </div>


            <button
                type="submit"
                class="btn primary-btn full-btn">

                Submit Issue

            </button>


            <div
                id="issueMessage"
                class="message">
            </div>

        </form>

    </div>

</section>

</main>


<footer>

    <p>
        © 2026 CivicFix
    </p>

</footer>


<script src="script.js"></script>

</body>
</html>
